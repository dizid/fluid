[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Allow Firebase client config and Stripe publishable key in build output
  # These are designed to be public (security comes from Firebase rules, not hiding keys)
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_STRIPE_PUBLISHABLE_KEY"

[dev]
  command = "npm run dev"
  targetPort = 3000

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content policy in REPORT-ONLY mode (T-0636, Nov 20 2026): nothing is blocked yet;
    # browsers send violations to /api/csp-report (Netlify function log). Enforce later by
    # renaming the header to Content-Security-Policy once the log stays clean.
    # Everything loads from this site (fonts self-hosted since Nov 20 2026). The Stripe checkout
    # is a full-page redirect (not covered by CSP); the paid PDF is a blob: download link (not
    # covered either).
    # Inline scripts: `node scripts/csp-hash.mjs` after a build lists any that need a hash here.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report"

# Stripe return page: its link (?session_id=) downloads the buyer's personal PDF, which
# holds their quiz answers. Never index it, never send the address on as a referrer.
[[headers]]
  for = "/guide/download"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Every public page is a static file (build/prerender.ts writes <path>.html), served
# directly. Rules below only apply when no file matches.

# Stripe's return page after paying: no static file, the app renders it.
[[redirects]]
  from = "/guide/download"
  to = "/index.html"
  status = 200

# Anything else is unknown: status 404 for search engines (was 200 + the home page).
# People still land on the course: the app loads from 404.html and its router sends
# unknown paths (and old account-era links like /login) to the home page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
